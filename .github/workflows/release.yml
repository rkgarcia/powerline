name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

env:
  V_VERSION: '0.5.2'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest available Ubuntu, so the binaries run on older glibc too.
          - target: linux-x86_64
            runner: ubuntu-22.04
          - target: linux-aarch64
            runner: ubuntu-22.04-arm
          - target: macos-arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: vlang/setup-v@v1.7
        with:
          version: ${{ env.V_VERSION }}

      - name: Test
        run: v test .

      - name: Build
        run: v -prod -o powerline .

      - name: Smoke test
        run: |
          ./powerline config > /dev/null
          ./powerline prompt plain

      - name: Package
        run: |
          name="powerline-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp powerline README.md default.toml "$name/"
          tar -czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: powerline-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum powerline-*.tar.gz > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix (v1.2.3-rc.1) is a semver pre-release.
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            "${prerelease[@]}"
